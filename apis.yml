name: StratoScale
description: >-
  Stratoscale was an Israeli software-defined data center company founded in 2013 in Herzliya by Ariel
  Maislos and backed by Battery Ventures, Bessemer Venture Partners, Intel Capital, Cisco, Qualcomm
  Ventures and SanDisk ($70M raised). Its flagship product, Stratoscale Symphony (announced December
  2015), delivered AWS-compatible cloud infrastructure on commodity x86 hardware — an API-driven,
  hyperconverged platform exposing EC2-, S3-, EBS-, EFS-, RDS-, ELB- and EMR-compatible services plus
  Kubernetes and Docker, alongside OpenStack and vCenter compatibility for hybrid and multi-cloud
  operations. The company ceased operations at the end of 2019 due to insufficient funding; there is no
  longer a live developer portal, documentation site, or reachable API surface. Its public GitHub
  organization (open-source Go/go-swagger tooling) remains available.
